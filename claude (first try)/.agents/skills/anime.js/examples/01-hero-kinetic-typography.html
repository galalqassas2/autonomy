<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinetic Typography Hero - Anime.js v4</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #090a0f;
      color: #f8fafc;
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      overflow: hidden;
    }

    .hero {
      text-align: center;
      max-width: 900px;
      padding: 2rem;
    }

    .badge {
      display: inline-block;
      padding: 0.5rem 1.25rem;
      border-radius: 9999px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #818cf8;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      opacity: 0;
    }

    h1.hero-title {
      font-size: clamp(2.5rem, 6vw, 5.5rem);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin-bottom: 1.5rem;
      /* NO gradient here — it breaks splitText child spans.
         Gradient is applied per-char via the [data-char] rule below. */
      color: #ffffff;
    }

    /* Apply gradient per character span generated by splitText */
    h1.hero-title [data-char] {
      background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 60%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: inline-block; /* Required for background-clip on inline */
    }

    /* Clip the overflow created by translateY reveal so chars don't spill */
    h1.hero-title [data-word] {
      overflow: hidden;
      display: inline-block;
      vertical-align: bottom;
    }

    .hero-desc {
      font-size: 1.25rem;
      color: #94a3b8;
      max-width: 600px;
      margin: 0 auto 2.5rem auto;
      opacity: 0;
    }

    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 2.25rem;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #ffffff;
      font-size: 1.125rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.5);
      opacity: 0;
      font-family: inherit;
    }

    .cta-btn:hover {
      transform: scale(1.04);
      transition: transform 0.2s;
    }
  </style>
</head>
<body>

  <main class="hero">
    <div class="badge">Next Generation Animation</div>
    <h1 class="hero-title">IMAGINATION UNBOUNDED</h1>
    <p class="hero-desc">Craft immersive, 60fps kinetic typography and spring-physics motion with Anime.js v4.</p>
    <button class="cta-btn">Explore Engine &rarr;</button>
  </main>

  <!-- esm.sh bundles ALL Anime.js v4 sub-modules including splitText -->
  <script type="module">
    import { splitText, createTimeline, stagger, spring } from 'https://esm.sh/animejs';

    // Split into words (overflow-clip wrappers) + individual chars
    const split = splitText('.hero-title', {
      chars: true,
      words: true,
      accessible: true
    });

    const tl = createTimeline({ defaults: { ease: 'outExpo' } });

    tl.add('.badge', {
      opacity:    [0, 1],
      scale:      [0.75, 1],
      translateY: [-16, 0],
      duration:   600
    })
    .add(split.chars, {
      opacity:    [0, 1],
      translateY: ['110%', '0%'],
      rotateX:    [-80, 0],
      delay:      stagger(20, { from: 'center' }),
      duration:   1100,
      ease:       spring({ stiffness: 130, damping: 14 })
    }, '-=300')
    .add('.hero-desc', {
      opacity:    [0, 1],
      translateY: [28, 0],
      duration:   800
    }, '-=700')
    .add('.cta-btn', {
      opacity:    [0, 1],
      scale:      [0.85, 1],
      translateY: [18, 0],
      duration:   700,
      ease:       spring({ stiffness: 160, damping: 10 })
    }, '-=450');
  </script>
</body>
</html>
