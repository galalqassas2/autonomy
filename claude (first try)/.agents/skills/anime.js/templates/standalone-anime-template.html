<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime.js v4 Standalone Template</title>
  <style>
    /* Baseline Reset & Modern Aesthetic Defaults */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0c10;
      color: #f0f2f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      perspective: 1000px; /* Crucial for 3D rotations */
    }
    .demo-container {
      width: 90%;
      max-width: 1000px;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      text-align: center;
    }
    h1 {
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }
    .accent-card {
      width: 140px;
      height: 140px;
      margin: 2rem auto;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      border-radius: 24px;
      box-shadow: 0 20px 40px -10px rgba(99, 102, 241, 0.5);
      cursor: pointer;
    }
  </style>

  <!-- ESM Import Map for Anime.js v4 -->
  <!--
    IMPORTANT: Use esm.sh as the CDN — it bundles ALL v4 sub-modules including
    splitText, scrambleText, createLayout, createDraggable, onScroll, morphTo etc.
    jsdelivr's /+esm only bundles the core animation module.
  -->
</head>
<body>

  <main class="demo-container">
    <h1 class="hero-heading">Elevate Your Visuals</h1>
    <div class="accent-card"></div>
  </main>

  <script type="module">
    import { animate, splitText, stagger, spring, utils } from 'https://esm.sh/animejs';

    // 1. Kinetic Text Reveal
    const { chars } = splitText('.hero-heading', { chars: true, words: true });
    
    animate(chars, {
      opacity: [0, 1],
      translateY: ['100%', '0%'],
      rotateX: [-90, 0],
      delay: stagger(25, { from: 'center' }),
      duration: 1000,
      ease: spring({ stiffness: 140, damping: 12 })
    });

    // 2. Interactive Card Pulse on Click
    const [ $card ] = utils.$('.accent-card');
    $card.addEventListener('click', () => {
      animate($card, {
        scale: [1, 1.25, 1],
        rotateZ: [0, 15, -15, 0],
        duration: 800,
        ease: 'outBack'
      });
    });
  </script>
</body>
</html>
